[pytest]
# Repo root on sys.path so tests can `import core.xxx`, `import analyzers.xxx`
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# pytest-asyncio: let `async def test_...` run without a per-test marker
asyncio_mode = auto
addopts = -ra -q
